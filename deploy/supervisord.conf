; VibeHub 单容器进程编排（《容器化部署规范》§2）
; postgres（pgvector 基底镜像内置） + VibeHub 应用 双进程，root 守护。
[supervisord]
nodaemon=true
user=root

[program:postgres]
; pgvector 官方镜像入口：处理首初始化（initdb/建库/建用户），以 postgres 用户运行
command=/usr/local/bin/docker-entrypoint.sh postgres
user=postgres
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vibehub]
; HTTP 服务：REST API + 前端静态页 + SSE + MCP SSE 端点（:3210）
; 经 bootstrap 引导（等 PG→建扩展→迁移→启动），修复 entrypoint/supervisord 顺序死锁（R53）
command=node /app/dist/bootstrap.js
directory=/app
autorestart=true
priority=20
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
